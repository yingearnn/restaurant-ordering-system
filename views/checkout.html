<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Checkout</title>
    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="/css/cart-pages.css">
</head>
<body>
    <a href="/cart/retrieve/all" style="display:inline-block; margin-bottom:16px; font-family:'Courier New', Courier, monospace;">&larr; Back to Cart</a>
   
    <h1>Checkout Page</h1>
    

    <table id="checkout-table">
        <thead>
            <tr>
                <th>Product</th>
                <th>Quantity</th>
                <th>Unit Price</th>
                <th>Line Subtotal</th>
                <th>Discount</th>
                <th>Line Total</th>
            </tr>
        </thead>
        <tbody id="checkout-table-body"></tbody>
    </table>
        <p>Items Subtotal: <span id="items-subtotal">0.00</span></p>
        <p>Product Discounts: -<span id="product-discount">0.00</span></p>
        <p>Cart Value Discount (<span id="cart-discount-pct">0</span>%): -<span id="cart-discount">0.00</span></p>
        <p>Delivery Fee: <span id="delivery-fee">0.00</span></p>
        <h3>Total: <span id="final-total">0.00</span></h3>
    </div>

    <p id="error-message" style="color: red;"></p>
    <p id="success-message" style="color: green;"></p>

    <button id="place-order-btn">Place Order</button>

    <script src="/js/checkout.js"></script>
</body>
</html>
