<!DOCTYPE html>
<html lang="en">
<head>
<script src="js/demo-api.js"></script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Feedback</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
      <a class="navbar-brand" href="#">Restaurant Ordering System</a>
      <div class="navbar-nav ms-auto align-items-center">
        <span class="navbar-text me-3">Welcome, Member</span>
        <a href="login.html" class="btn btn-outline-light btn-sm">Logout</a>
      </div>
    </div>
  </nav>

  <main class="container mt-4">

    <div class="mb-3">
      <a href="products.html" class="btn btn-outline-secondary btn-sm">← Back to Products</a>
    </div>

    <div id="general-message" class="alert mt-2" style="display:none;"></div> 

    <div class="card">
      <div class="card-body">
        <h4 class="card-title text-center">Retrieve All My Feedback</h4>

        <div id="feedback-message" class="alert" style="display:none;"></div>
        <div id="feedback-list">
          <p class="text-muted text-center">Loading your feedback...</p>
        </div>
      </div>
    </div>
 <!-- DELETE FEEDBACK MODAL -->
    <div class="modal fade" id="deleteConfirmModal" tabindex="-1">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title">Confirm Delete</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body">
        <p>Are you sure you want to delete this feedback? This cannot be undone.</p>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
        <button type="button" class="btn btn-danger" id="confirm-delete-btn">Delete</button>
      </div>
    </div>
  </div>
</div>

    <!-- UPDATE FEEDBACK MODAL -->
    <div class="modal fade" id="updateFeedbackModal" tabindex="-1">
      <div class="modal-dialog">
        <div class="modal-content">
          <div class="modal-header">
            <h5 class="modal-title">Update Feedback</h5>
            <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
          </div>
          <div class="modal-body">
            <div id="update-feedback-message" class="alert" style="display:none;"></div>
            <input type="hidden" id="update-feedback-id">
            <div class="mb-3">
              <label class="form-label">Rating</label>
              <select class="form-select" id="update-feedback-rating">
                <option value="1"> 1</option>
                <option value="2"> 2</option>
                <option value="3"> 3</option>
                <option value="4"> 4</option>
                <option value="5"> 5</option>
              </select>
            </div>
            <div class="mb-3">
              <label class="form-label">Comment</label>
              <textarea class="form-control" id="update-feedback-comment" rows="3"></textarea>
            </div>
          </div>
          <div class="modal-footer">
            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
            <button type="button" class="btn btn-primary" onclick="updateFeedback()">Update</button>
          </div>
        </div>
      </div>
    </div>

  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/main.js"></script>
<script src="js/feedback.js"></script>

<script>
  document.addEventListener('DOMContentLoaded', fetchMyFeedback);
</script>
</body>
</html>
