<!DOCTYPE html>
<html lang="en">
<head>
<script src="js/demo-api.js"></script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Product Details - Member View</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
      <a class="navbar-brand" href="#">Restaurant Ordering System</a>
      <div class="navbar-nav ms-auto align-items-center">
        <span class="navbar-text me-3" id="user-welcome">Welcome, Member</span>
        <a href="my-feedback.html" class="btn btn-outline-warning btn-sm me-2">My Feedback</a>
        <a href="login.html" class="btn btn-outline-light btn-sm">Logout</a>
      </div>
    </div>
  </nav>

  <main class="container mt-4">

    <div class="mb-3">
      <a href="products.html" class="btn btn-outline-secondary btn-sm">← Back to Products</a>
    </div>

    <div id="general-message" class="alert mt-2" style="display:none;"></div>
    

    <div id="loading" class="text-center py-5">
      <div class="spinner-border text-secondary" role="status">
        <span class="visually-hidden">Loading...</span>
      </div>
    </div>

    <div id="error-message" class="alert alert-danger" style="display: none;">
      Failed to load product details.
    </div>

    <!-- Product Detail Card -->
    <div id="product-detail" style="display: none;">
      <div class="card">
        <div class="card-body">
          <h4 class="card-title mb-4" id="detail-name"></h4>
          <table class="table table-striped align-middle">
            <tbody>
              <tr>
                <th scope="row" style="width: 200px;">Category</th>
                <td id="detail-category"></td>
              </tr>
              <tr>
                <th scope="row">Description</th>
                <td id="detail-description"></td>
              </tr>
              <tr>
                <th scope="row">Price</th>
                <td id="detail-price"></td>
              </tr>
              <tr>
                <th scope="row">Status</th>
                <td id="detail-status"></td>
              </tr>
              <tr>
                <th scope="row">Created At</th>
                <td id="detail-created-at"></td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>

      <!-- ===== CREATE FEEDBACK FORM ===== -->
      <div class="card mt-4">
        <div class="card-body">
          <h5 class="card-title">Leave Feedback</h5>
          <div id="feedback-form-message" class="alert" style="display:none;"></div>
          <form id="create-feedback-form" onsubmit="createFeedback(event)">
            <div class="mb-3">
              <label class="form-label">Order ID</label>
              <input type="number" class="form-control" id="feedback-order-id" placeholder="Enter your order ID" required>
            </div>
            <div class="mb-3">
              <label class="form-label">Rating</label>
              <select class="form-select" id="feedback-rating" required>
                <option value="">Select rating</option>
                <option value="1"> 1</option>
                <option value="2"> 2</option>
                <option value="3">3</option>
                <option value="4">4</option>
                <option value="5"> 5</option>
              </select>
            </div>
            <div class="mb-3">
              <label class="form-label">Comment</label>
              <textarea class="form-control" id="feedback-comment" rows="3" placeholder="Write your feedback..."></textarea>
            </div>
            <button type="submit" class="btn btn-primary">Submit Feedback</button>
          </form>
        </div>
      </div>

      <!-- ===== FEEDBACK LIST ===== -->
      <div class="card mt-4 mb-4">
        <div class="card-body">
          <h5 class="card-title text-center">Feedback For This Product</h5>
          <div id="feedback-list">
            <p class="text-muted text-center">Loading feedback...</p>
          </div>
        </div>
      </div>
    </div>


  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/main.js"></script>
  <script src="js/feedback.js"></script>

  <script>
    // ===== ON PAGE LOAD =====
    document.addEventListener('DOMContentLoaded', async () => {

      // get logged in user
      try {
        const authRes  = await fetch('/api/auth/status');
        const authData = await authRes.json();
        if (authData.authenticated) {
    currentUserId = authData.user.id;
    updateUserWelcome(authData.user);
}
      } catch(err) {
        console.error('Error getting auth status:', err);
      }

      // get product id from URL
      const params     = new URLSearchParams(window.location.search);
      const productId  = params.get('id');
      currentProductId = productId;

      const loading       = document.getElementById('loading');
      const errorMessage  = document.getElementById('error-message');
      const productDetail = document.getElementById('product-detail');

      if (!productId) {
        loading.style.display      = 'none';
        errorMessage.style.display = 'block';
        errorMessage.textContent   = 'No product specified.';
        return;
      }

      try {
        const response = await fetch(`/products/${productId}`);
        const data     = await response.json();

        loading.style.display = 'none';

        if (!data.success || !data.product) {
          errorMessage.style.display = 'block';
          return;
        }

        const product = data.product;

        document.title = `${product.name} - Member View`;
        document.getElementById('detail-name').textContent        = product.name;
        document.getElementById('detail-category').textContent    = product.category || '-';
        document.getElementById('detail-description').textContent = product.description || '-';
        document.getElementById('detail-price').textContent       = `$${parseFloat(product.price).toFixed(2)}`;
        document.getElementById('detail-created-at').textContent  = new Date(product.created_at).toLocaleDateString();

        const statusCell = document.getElementById('detail-status');
        statusCell.innerHTML = `
          <span class="badge ${product.is_available ? 'bg-success' : 'bg-secondary'}">
            ${product.is_available ? 'Available' : 'Unavailable'}
          </span>
        `;

        productDetail.style.display = 'block';

        // load feedback after product loads
        fetchFeedbackForProduct(productId);

      } catch (error) {
        console.error('Error fetching product detail:', error);
        loading.style.display      = 'none';
        errorMessage.style.display = 'block';
      }
    });
  </script>

</body>
</html>
